<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeriDoc receipt check</title>
<style>
  :root { --bg: #f7f7f4; --fg: #1d1d1b; --muted: #5d5d58; --card: #ffffff; --line: #d8d8d2; --ok: #1d6b3c; --bad: #a3261d; --warn: #8a5a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --fg: #ecece8; --muted: #a4a49d; --card: #1f1f1d; --line: #38382f; --ok: #6fcf97; --bad: #ff8a80; --warn: #f2c26b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  .privacy { color: var(--muted); margin: 0 0 1rem; }
  .limit { border-left: 4px solid var(--line); padding: .25rem .75rem; margin: 1rem 0; }
  #drop { display: block; border: 2px dashed var(--line); border-radius: .75rem; background: var(--card); padding: 2rem 1rem; text-align: center; cursor: pointer; }
  #drop.over, #drop:focus-within { border-color: var(--fg); }
  #drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  #verdict { font-size: 1.25rem; font-weight: 600; margin: 1.5rem 0 .5rem; }
  #verdict.ok { color: var(--ok); }
  #verdict.bad, .error { color: var(--bad); }
  ul { list-style: none; padding: 0; margin: .5rem 0; }
  li { padding: .35rem 0; border-bottom: 1px solid var(--line); }
  .warn { color: var(--warn); }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Check a VeriDoc receipt</h1>
  <p class="privacy">No login · no network · nothing is uploaded</p>
  <label id="drop" for="file">Drop a receipt file (.zip) here, or choose one<input id="file" type="file" accept=".zip,application/zip"></label>
  <p class="limit">This checks that the record was not changed after it was saved. It cannot prove that the original chat export was genuine.</p>
  <div id="result" aria-live="polite"></div>
</main>
<script>
/*@code*/

const SYMBOL = { true: "✓", false: "⚠" };
const WORDS = {
  spec_version: "Receipt", leaves: "Messages and files", merkle_root: "Record as a whole", chain: "Version chain",
  version_roots: "Version snapshots", import_record: "Import record", timestamps: "Times", anchor: "Time source",
};

function describeDifference(fd) {
  const at = {
    chain_link: fd.version_n ? `version ${fd.version_n} of the chain` : "the version chain",
    import_record: "the import record", root: "the record as a whole", receipt: "the receipt",
  }[fd.kind];
  return at ?? `${fd.kind.replace(/_/g, " ")} #${fd.seq}`;
}

function show(result, error) {
  const box = document.getElementById("result");
  box.replaceChildren();
  const add = (tag, text, cls) => {
    const el = document.createElement(tag);
    el.textContent = text;
    if (cls) el.className = cls;
    box.appendChild(el);
    return el;
  };
  if (error) {
    add("p", error, "error");
    return;
  }
  const ok = result.verdict === "UNCHANGED";
  const verdict = add("p", ok ? "✓ UNCHANGED since recording" : "⚠ ALTERED after recording");
  verdict.id = "verdict";
  verdict.className = ok ? "ok" : "bad";
  if (result.first_difference) add("p", `First difference: ${describeDifference(result.first_difference)}`);
  const list = document.createElement("ul");
  for (const check of result.checks) {
    const item = document.createElement("li");
    item.textContent = `${SYMBOL[check.ok]} ${WORDS[check.name] ?? check.name}: ${check.detail}`;
    list.appendChild(item);
  }
  box.appendChild(list);
  for (const warning of result.warnings) add("p", `Note: ${warning}`, "warn");
}

async function check(file) {
  try {
    show(await verifyBundle(new Uint8Array(await file.arrayBuffer())));
  } catch (error) {
    show(null, error.message);
  }
}

const drop = document.getElementById("drop");
document.getElementById("file").addEventListener("change", (e) => e.target.files[0] && check(e.target.files[0]));
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  if (e.dataTransfer.files[0]) check(e.dataTransfer.files[0]);
});
</script>
</body>
</html>
