# Hindi draft: needs native-speaker review (Q-17). CONFIRM and the code stay in Latin letters.
# No literal rupee sign before a money slot (the formatter adds it).
greeting: "नमस्ते {other_name}, हमारी बात का सार यह है:"
closing: "अगर सब सही है तो जवाब दें: CONFIRM {code}"
bullet: "• "
lines:
  - key: price
    terms: [scope, quantity, price]
    variant_from: price
    templates:
      item: "{quantity} {scope}, {price} प्रति नग = {total}"
      plain: "{quantity} {scope}, {price} प्रति नग = {total}"
      total: "{quantity} {scope}, कुल {total}"
  - key: advance
    terms: [advance]
    variant_from: advance
    templates:
      paid: "{advance} एडवांस मिल गया"
      on_date: "{advance} एडवांस {date} तक देना है"
      plain: "{advance} एडवांस"
  - key: delivery_date
    terms: [delivery_date]
    templates:
      plain: "डिलीवरी {delivery_date} तक"
  - key: final_payment
    terms: [final_payment]
    variant_from: final_payment
    templates:
      on_delivery: "बाकी {final_payment} डिलीवरी पर"
      after_delivery_days: "बाकी {final_payment} डिलीवरी के {days} दिन के अंदर"
      after_delivery: "बाकी {final_payment} डिलीवरी के बाद"
      on_date: "बाकी {final_payment} {date} को"
      on_completion: "बाकी {final_payment} काम पूरा होने पर"
      plain: "बाकी {final_payment}"
      noamt_on_delivery: "बाकी रकम डिलीवरी पर देनी है"
      noamt_after_delivery_days: "बाकी रकम डिलीवरी के {days} दिन के अंदर देनी है"
      noamt_after_delivery: "बाकी रकम डिलीवरी के बाद देनी है"
      noamt_on_date: "बाकी रकम {date} को देनी है"
      noamt_on_completion: "बाकी रकम काम पूरा होने पर देनी है"
  - key: late_penalty
    terms: [late_penalty]
    templates:
      plain: "देरी होने पर: {late_penalty}"
  - key: gst_status
    terms: [gst_status]
    templates:
      plain: "GST: {gst_status}"
