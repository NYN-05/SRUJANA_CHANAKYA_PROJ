# Hindi draft: needs native-speaker review (Q-17). No literal rupee sign before a money slot.
deadline+deliverable:
  casual: "एक बात: आपको {deliverable} {deadline} तक मिलेगा, ठीक है?"
  polite: "बस पक्का करने के लिए, आपको {deliverable} {deadline} तक मिलेगा। क्या यह ठीक रहेगा?"
  firm: "बात साफ़ रखने के लिए, कृपया पक्का करें: {deliverable} {deadline} तक दिया जाएगा।"
