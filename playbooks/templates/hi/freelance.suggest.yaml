  casual: "एक बात: फीस {price} है और भुगतान ऐसे होगा: {payment_schedule}। ठीक है?"
  polite: "बस पक्का करने के लिए, फीस {price} है और भुगतान ऐसे होगा: {payment_schedule}। क्या यह ठीक रहेगा?"
